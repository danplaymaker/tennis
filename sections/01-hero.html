<!-- GSAP + ScrollTrigger — add ONCE site-wide (Project settings → Custom code → before </body>) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script>
(function () {
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion || !window.gsap) return;               /* content stays fully visible */

  var gsap = window.gsap;
  var hasScrollTrigger = !!window.ScrollTrigger;
  if (hasScrollTrigger) gsap.registerPlugin(window.ScrollTrigger);

  var EASE = 'expo.out';                                    /* cubic-bezier(0.16, 1, 0.3, 1) */
  var section = document.querySelector('.section_hero');
  if (!section) return;

  var navItems       = section.querySelectorAll('[data-hero="nav-item"]');
  var wordmarkLayers = section.querySelectorAll('[data-hero="wordmark-layer"]');
  var labels         = section.querySelectorAll('[data-hero="label"]');
  var playIcon       = section.querySelector('[data-hero="play"]');
  var showreel       = section.querySelector('[data-hero="showreel"]');
  var showreelImage  = section.querySelector('[data-hero="showreel-image"]');

  /* =====================================================
     PART A — LOAD ENTRANCE (simple tweens; Flowboard-convertible)
     ===================================================== */
  gsap.set(navItems,       { y: 12, opacity: 0 });
  gsap.set(wordmarkLayers, { yPercent: 40, opacity: 0 });
  gsap.set(labels,         { opacity: 0 });
  gsap.set(playIcon,       { scale: 0.6, opacity: 0 });

  gsap.timeline({ defaults: { ease: EASE } })
    .to(wordmarkLayers, { yPercent: 0, opacity: 1, duration: 1.2, stagger: 0.1 }, 0.1)
    .to(navItems,       { y: 0, opacity: 1, duration: 0.6, stagger: 0.08 }, 0.3)
    .to(labels,         { opacity: 1, duration: 0.6, stagger: 0.08 }, 0.7)
    .to(playIcon,       { scale: 1, opacity: 1, duration: 0.6 }, 0.9);

  /* =====================================================
     PART B — SCROLL WORK (ScrollTrigger; keep as custom code)
     ===================================================== */
  if (hasScrollTrigger && showreel && showreelImage) {
    /* Mask reveal: clip opens upward while the image settles from 1.15 → 1 */
    gsap.set(showreel,      { clipPath: 'inset(100% 0% 0% 0%)' });
    gsap.set(showreelImage, { scale: 1.15 });

    gsap.timeline({
      defaults: { ease: EASE },
      scrollTrigger: { trigger: showreel, start: 'top 85%', once: true }
    })
      .to(showreel,      { clipPath: 'inset(0% 0% 0% 0%)', duration: 1.2 }, 0)
      .to(showreelImage, { scale: 1, duration: 1.4 }, 0);

    /* Parallax: ±7% of the (116%-tall) image ≈ 8% of the frame */
    gsap.fromTo(showreelImage, { yPercent: -7 }, {
      yPercent: 7,
      ease: 'none',
      scrollTrigger: { trigger: showreel, start: 'top bottom', end: 'bottom top', scrub: true }
    });
  }

  /* =====================================================
     PART C — HOVER MICRO-INTERACTIONS (JS, child-targeting; custom code)
     ===================================================== */
  /* Text roll on the vertical social links */
  var rollLinks = section.querySelectorAll('[data-hero="roll-link"]');
  Array.prototype.forEach.call(rollLinks, function (link) {
    var inner = link.querySelector('[data-hero="roll-inner"]');
    if (!inner) return;
    link.addEventListener('mouseenter', function () { gsap.to(inner, { yPercent: -50, duration: 0.5, ease: EASE }); });
    link.addEventListener('mouseleave', function () { gsap.to(inner, { yPercent: 0,   duration: 0.5, ease: EASE }); });
  });

  /* Menu button: lines nudge left in sequence */
  var menuButton = section.querySelector('[data-hero-menu]');
  if (menuButton) {
    var lines = menuButton.querySelectorAll('[data-hero="menu-line"]');
    menuButton.addEventListener('mouseenter', function () { gsap.to(lines, { x: -6, duration: 0.5, ease: EASE, stagger: 0.06 }); });
    menuButton.addEventListener('mouseleave', function () { gsap.to(lines, { x: 0,  duration: 0.5, ease: EASE, stagger: 0.06 }); });
  }
})();
</script>
