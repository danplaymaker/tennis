<style>
.section_services {
  position: relative;
  background-color: #101010;
}
.services_component {

}

  .services_logo.is-2 { width: 9.4rem;  height: 2.3rem; }
  .services_logo.is-3 { width: 10.5rem; height: 3.1rem; }

<script>
(function () {
  function init() {
    if (!window.PM) return;
    window.PM.onReady(function () {
      var section = document.querySelector('.section_services');
      if (!section || !window.PM.ready) return;
      var gsap = window.gsap, EASE = window.PM.EASE;

      /* ---- PART A — logo stagger (plain tween; Flowboard-convertible) ---- */
      var logos = section.querySelectorAll('[data-reveal-logo]');
      gsap.set(logos, { y: 16, opacity: 0 });
      gsap.to(logos, {
        y: 0, opacity: 1, duration: 0.6, ease: EASE, stagger: 0.06,
        scrollTrigger: window.ScrollTrigger ? { trigger: section.querySelector('.services_logo-row'), start: 'top 90%', once: true } : undefined
      });

      /* ---- PART B — line mask reveal on the services list (PM helper; custom code) ---- */
      window.PM.revealLines(section.querySelectorAll('[data-reveal-lines]'));
    });
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); }
})();
</script>
