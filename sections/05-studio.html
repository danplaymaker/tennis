<section class="section_studio">
  <div class="padding-global">
    <div class="container-large">
      <div class="padding-section-large is-bottom-medium">
        <div class="studio_component">

          <p class="section-label is-studio text-size-small text-color-muted">Our studio space</p>

          <!-- 59/71 SemiBold, 1107 wide (523:149) with icon trio (523:150) -->
          <h2 class="studio_heading heading-style-h2" data-reveal-lines>

            </span>Designing a <span class="studio_highlight">creative studio</span> to share with the community

          <!-- 4 × 358 × 537 (Figma "Group 8507" 523:131) -->

              <!-- Figma asset: "image 16" (523:140) — 411.27 × 548.36, offset −14.5 / −1.5 -->
              <img class="studio_image is-1" data-mask-image src="https://placehold.co/411x548/2a2a2a/555555?text=Studio+1" alt="Playmaker studio interior">

            <div class="studio_image-wrapper" data-mask>
              <!-- Figma asset: "Studio_Playmaker 5 1" (523:134) — 403.39 × 537.85, offset −30.6 / 0 -->

              <!-- Figma asset: "image 17" (523:143) — 431.51 × 575.35, offset −48.1 / −16.8 -->

<style>
.section_studio {
  position: relative;
  background-color: #101010;
}
.studio_component {
  position: relative;
}
.section-label.is-studio { top: 1.0625rem; }    /* label y 7417 vs heading 7400 */
.studio_heading {
  max-width: 69.1875rem;            /* 1107 */
}
.studio_highlight { display: inline; }

.studio_grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2rem;                        /* Figma gaps are 32 / 40 / 32 — approximated to 32 */
  margin-top: 5rem;                 /* heading bottom 7542 → images 7622 = 80 */
}
.studio_image-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 358 / 537;
  overflow: hidden;
  background-color: #1a1a1a;
}
.studio_image {
  position: absolute;
  display: block;
  object-fit: cover;
}
.studio_image.is-1 { left: -4.05%;  top: -0.28%; width: 114.88%; height: 102.12%; }
.studio_image.is-2 { left: -8.54%;  top: 0;      width: 112.68%; height: 100.16%; }
.studio_image.is-3 { left: -13.43%; top: -3.12%; width: 120.53%; height: 107.14%; }
.studio_image.is-4 { left: -4.85%;  top: 0.2%;   width: 125.51%; height: 111.65%; }

.studio_button-wrapper {
  margin-top: 5rem;                 /* images bottom 8159 → button 8239 = 80 */
}

/* ---------- Tablet ---------- */
@media screen and (max-width: 991px) {
  .studio_heading { max-width: 100%; }
  .studio_grid { grid-template-columns: repeat(2, 1fr); gap: 1.5rem; margin-top: 3rem; }
  .studio_button-wrapper { margin-top: 3rem; }
}

/* ---------- Mobile portrait ---------- */
@media screen and (max-width: 479px) {
  .studio_grid { grid-template-columns: 1fr; gap: 1rem; }
}
</style>

<script>
(function () {
  function init() {
    if (!window.PM) return;
    window.PM.onReady(function () {
      var section = document.querySelector('.section_studio');
      if (!section || !window.PM.ready) return;
      var gsap = window.gsap, EASE = window.PM.EASE;

      /* ---- PART A — button fade-up (plain tween; Flowboard-convertible) ---- */
      var fade = section.querySelectorAll('[data-reveal-fade]');
      gsap.set(fade, { y: 24, opacity: 0 });
      gsap.to(fade, {
        y: 0, opacity: 1, duration: 0.8, ease: EASE,
        scrollTrigger: window.ScrollTrigger ? { trigger: fade[0], start: 'top 92%', once: true } : undefined
      });

      /* ---- PART B — heading lines + staggered image masks + hover (PM; custom code) ---- */
      window.PM.revealLines(section.querySelectorAll('[data-reveal-lines]'));
      window.PM.maskReveal(section.querySelectorAll('[data-mask]'), {
        group: true, stagger: 0.1, trigger: section.querySelector('.studio_grid')
      });
      Array.prototype.forEach.call(section.querySelectorAll('[data-button]'), window.PM.buttonHover);

      /* Image hover: zoom inside the mask (wrappers are not links, so hover directly) */
      Array.prototype.forEach.call(section.querySelectorAll('[data-mask]'), function (wrapper) {
        var img = wrapper.querySelector('[data-mask-image]');
        wrapper.addEventListener('mouseenter', function () { gsap.to(img, { scale: 1.05, duration: 0.8, ease: EASE, overwrite: 'auto' }); });
        wrapper.addEventListener('mouseleave', function () { gsap.to(img, { scale: 1,    duration: 0.8, ease: EASE, overwrite: 'auto' }); });
      });
    });
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); }
})();
</script>
