<script>
(function () {
  function init() {
    if (!window.PM) return;
    window.PM.onReady(function () {
      var section = document.querySelector('.section_statement');
      if (!section || !window.PM.ready) return;
      var gsap = window.gsap, EASE = window.PM.EASE;

      /* ---- PART A — scroll-in fade (plain tween; Flowboard-convertible) ---- */
      var fade = section.querySelectorAll('[data-reveal-fade]');
      gsap.set(fade, { y: 24, opacity: 0 });
      gsap.to(fade, {
        y: 0, opacity: 1, duration: 0.8, ease: EASE, delay: 0.3,
        scrollTrigger: window.ScrollTrigger ? { trigger: section, start: 'top 80%', once: true } : undefined
      });

      /* ---- PART B — line mask reveal (PM helper; custom code) ---- */
      window.PM.revealLines(section.querySelectorAll('[data-reveal-lines]'));
    });
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); }
})();
</script>
