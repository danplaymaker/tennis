<!-- ============================================================
  00 — GLOBAL  (add ONCE per site)
  · <style>  → Webflow global classes (Client-First V2)
  · GSAP + ScrollTrigger + the PM motion helpers
    → Project settings → Custom code → before </body>
  Font: "Euclid Circular A" (Regular 400 / SemiBold 600) — upload to Webflow
  Every page: <body class="page-wrapper"> … sections … </body>
============================================================ -->

<style>
/* ---------- Page ---------- */
.page-wrapper {
  background-color: #101010;
  color: #ffffff;
  font-family: "Euclid Circular A", "Helvetica Neue", Arial, sans-serif;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---------- Structure ---------- */
.padding-global {
  position: relative;
  padding-left: 7.5rem;        /* 120px gutter @1920 (nav + vertical labels sit on it) */
  padding-right: 7.5rem;
}
.container-large {
  position: relative;
  width: 100%;
  max-width: 96rem;            /* 1536px content column → x 192–1728 @1920 */
  margin-left: auto;
  margin-right: auto;
}
.padding-section-large  { padding-top: 7.5rem; padding-bottom: 7.5rem; }   /* 120 + 120 = 240 rhythm */
.padding-section-medium { padding-top: 5rem;   padding-bottom: 5rem; }     /*  80 +  80 = 160 rhythm */
.padding-section-medium.is-bottom-large { padding-bottom: 7.5rem; }
.padding-section-large.is-bottom-medium { padding-bottom: 5rem; }

/* ---------- Type (Figma text styles) ---------- */
.heading-style-h2 {                 /* "Large": 59 / 71 SemiBold −2% */
  margin: 0;
  font-size: 3.6875rem;
  line-height: 4.4375rem;
  font-weight: 600;
  letter-spacing: -0.02em;
}
.text-size-medium {                 /* "Medium": 22 / 29 −2% */
  font-size: 1.375rem;
  line-height: 1.8125rem;
  letter-spacing: -0.02em;
  font-weight: 400;
}
.text-size-small {                  /* "Small": 14 / 22 −2% */
  font-size: 0.875rem;
  line-height: 1.375rem;
  letter-spacing: -0.02em;
  font-weight: 400;
}
.text-weight-semibold { font-weight: 600; }
.text-color-yellow    { color: #ffff1f; }
.text-color-muted     { color: rgba(255, 255, 255, 0.15); }

/* ---------- Vertical section label (x136 @1920 = container − 56) ---------- */
.section-label {
  position: absolute;
  left: -3.5rem;
  top: 0;
  margin: 0;
  white-space: nowrap;
  transform-origin: top left;
  transform: rotate(90deg) translateY(-100%);   /* reads top → bottom, matches Figma rotate 90 */
}

/* ---------- Heading icon trio (Figma "Group 7159": 65.69 × 25) ---------- */
.heading-icon_wrapper {
  position: relative;
  display: inline-block;
  width: 4.1063rem;
  height: 1.5625rem;
  margin-right: 2.3125rem;     /* ≈ the 7-space indent in Figma minus the icon width */
  vertical-align: middle;
}
.heading-icon_image {
  position: absolute;
  top: 0;
  width: 1.415rem;             /* 22.64 */
  height: 1.5625rem;           /* 25 */
}
.heading-icon_image.is-1 { left: 0; }
.heading-icon_image.is-2 { left: 1.2763rem; }                    /* 20.42 */
.heading-icon_image.is-3 { left: 2.5519rem; width: 1.5538rem; }  /* 40.83 / 24.86 */

/* ---------- Button (Figma "Explore more": 250 × 74, 3px border, r55) ---------- */
.button {
  display: inline-flex;
  align-items: center;
  gap: 0.875rem;               /* text → arrow 14 */
  height: 4.625rem;            /* 74 */
  padding: 0 2.0625rem 0 2.5rem; /* 33 right / 40 left */
  border: 0.1875rem solid #ffffff;
  border-radius: 3.4375rem;
  background-color: transparent;
  color: #ffffff;
  text-decoration: none;
  transition: background-color 0.6s cubic-bezier(0.16, 1, 0.3, 1), color 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
.button:hover { background-color: #ffffff; color: #101010; }
.button_text {
  font-size: 1.375rem;
  line-height: 1.75rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  white-space: nowrap;
}
.button_arrow {
  display: block;
  width: 1.875rem;             /* 30 */
  height: 0.9375rem;           /* ~14.7 */
}

/* ---------- Roll link (text swaps vertically on hover; driven by PM.roll) ---------- */
.roll-link {
  position: relative;
  display: inline-block;
  overflow: hidden;
  color: inherit;
  text-decoration: none;
}
.roll-link_text { display: block; }
.roll-link_text.is-clone {
  position: absolute;
  top: 100%;
  left: 0;
}

/* ---------- Line reveal (markup generated by PM.revealLines) ---------- */
.line-reveal_mask {
  display: block;
  overflow: hidden;
  padding-bottom: 0.1em;       /* keep descenders inside the mask */
  margin-bottom: -0.1em;
}
.line-reveal_inner { display: block; }

/* ---------- Tablet ---------- */
@media screen and (max-width: 991px) {
  .padding-global { padding-left: 2.5rem; padding-right: 2.5rem; }
  .padding-section-large  { padding-top: 6rem; padding-bottom: 6rem; }
  .padding-section-medium { padding-top: 4rem; padding-bottom: 4rem; }
  .padding-section-medium.is-bottom-large { padding-bottom: 6rem; }
  .padding-section-large.is-bottom-medium { padding-bottom: 4rem; }
  .heading-style-h2 { font-size: 2.75rem; line-height: 3.375rem; }
  .section-label { position: static; transform: none; margin-bottom: 1.5rem; }
  .heading-icon_wrapper { margin-right: 1.5rem; }
}

/* ---------- Mobile landscape ---------- */
@media screen and (max-width: 767px) {
  .padding-section-large  { padding-top: 4rem; padding-bottom: 4rem; }
  .padding-section-medium { padding-top: 3rem; padding-bottom: 3rem; }
  .padding-section-medium.is-bottom-large { padding-bottom: 4rem; }
  .padding-section-large.is-bottom-medium { padding-bottom: 3rem; }
  .heading-style-h2 { font-size: 2.25rem; line-height: 2.75rem; }
  .text-size-medium { font-size: 1.125rem; line-height: 1.5rem; }
  .button { height: 3.75rem; padding: 0 1.5rem 0 1.75rem; }
  .button_text { font-size: 1.125rem; }
}

/* ---------- Mobile portrait ---------- */
@media screen and (max-width: 479px) {
  .padding-global { padding-left: 1.25rem; padding-right: 1.25rem; }
  .heading-style-h2 { font-size: 1.875rem; line-height: 2.25rem; }
  .heading-icon_wrapper { width: 3rem; height: 1.125rem; margin-right: 1rem; }
  .heading-icon_image { width: 1rem; height: 1.125rem; }
  .heading-icon_image.is-2 { left: 0.9rem; }
  .heading-icon_image.is-3 { left: 1.8rem; width: 1.1rem; }
}
</style>

<!-- GSAP + ScrollTrigger (site-wide, before </body>) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script>
/* ============================================================
   PM — shared motion helpers. One easing language: expo.out.
   Every helper no-ops when GSAP is missing or the visitor
   prefers reduced motion, so content is always visible.
   ============================================================ */
window.PM = (function () {
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var hasGsap = !!window.gsap;
  var hasST = hasGsap && !!window.ScrollTrigger;
  var ready = hasGsap && !reduce;
  if (hasST) window.gsap.registerPlugin(window.ScrollTrigger);

  var EASE = 'expo.out';                       /* cubic-bezier(0.16, 1, 0.3, 1) */
  var splitRegistry = [];

  function toArray(x) {
    if (!x) return [];
    if (x.nodeType) return [x];
    return Array.prototype.slice.call(x);
  }
  function st(el, start) {
    return hasST ? { trigger: el, start: start || 'top 85%', once: true } : undefined;
  }

  /* Run after DOM + web fonts are ready (line splitting needs final metrics) */
  function onReady(fn) {
    var run = function () {
      if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fn); } else { fn(); }
    };
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', run); } else { run(); }
  }

  /* ---- Split an element into visual lines: .line-reveal_mask > .line-reveal_inner ---- */
  function splitLines(el) {
    var original = el.innerHTML;
    var nodes = toArray(el.childNodes);
    var frag = document.createDocumentFragment();
    var units = [];
    var forceBreak = false;

    nodes.forEach(function (node) {
      if (node.nodeType === 3) {
        node.nodeValue.split(/(\s+)/).forEach(function (part) {
          if (!part) return;
          if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(' ')); return; }
          var span = document.createElement('span');
          span.className = 'line-reveal_word';
          span.textContent = part;
          span.__pmBreak = forceBreak; forceBreak = false;
          frag.appendChild(span); units.push(span);
        });
      } else if (node.nodeType === 1) {
        if (node.tagName === 'BR') { forceBreak = true; return; }
        node.__pmBreak = forceBreak; forceBreak = false;
        frag.appendChild(node); units.push(node);
      }
    });

    el.innerHTML = '';
    el.appendChild(frag);

    var lineHeight = parseFloat(window.getComputedStyle(el).lineHeight) || 24;
    var lines = [], current = null, lastTop = null;
    units.forEach(function (u) {
      var top = u.getBoundingClientRect().top;
      if (current === null || u.__pmBreak || Math.abs(top - lastTop) > lineHeight * 0.5) {
        current = []; lines.push(current); lastTop = top;
      }
      current.push(u);
    });

    el.innerHTML = '';
    var inners = [];
    lines.forEach(function (line) {
      var mask = document.createElement('span');  mask.className = 'line-reveal_mask';
      var inner = document.createElement('span'); inner.className = 'line-reveal_inner';
      line.forEach(function (u, i) {
        if (i > 0) inner.appendChild(document.createTextNode(' '));
        inner.appendChild(u);
      });
      mask.appendChild(inner);
      el.appendChild(mask);
      inners.push(inner);
    });
    return { inners: inners, original: original };
  }

  /* Un-split everything on a real width change (final state stays visible) */
  var lastWidth = window.innerWidth, resizeTimer;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastWidth) return;
    lastWidth = window.innerWidth;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      splitRegistry.forEach(function (item) {
        if (item.tween && item.tween.scrollTrigger) item.tween.scrollTrigger.kill();
        if (item.tween) item.tween.kill();
        item.el.innerHTML = item.original;
      });
      splitRegistry = [];
      if (hasST) window.ScrollTrigger.refresh();
    }, 200);
  });

  var api = { reduce: reduce, ready: ready, EASE: EASE, onReady: onReady };

  /* Heading: line-based mask reveal (1s, 0.08 stagger) */
  api.revealLines = function (els, opts) {
    if (!ready) return;
    opts = opts || {};
    toArray(els).forEach(function (el) {
      var split = splitLines(el);
      window.gsap.set(split.inners, { yPercent: 100 });
      var tween = window.gsap.to(split.inners, {
        yPercent: 0, duration: 1, ease: EASE, stagger: 0.08, delay: opts.delay || 0,
        scrollTrigger: st(el, opts.start)
      });
      splitRegistry.push({ el: el, tween: tween, original: split.original });
    });
  };

  /* Media: clip-path opens upward while the image settles 1.15 → 1.
     Pass a NodeList of [data-mask] wrappers, each holding a [data-mask-image].
     opts.group = true → one timeline, staggered, triggered by opts.trigger. */
  api.maskReveal = function (wrappers, opts) {
    if (!ready) return;
    opts = opts || {};
    var list = toArray(wrappers);
    if (!list.length) return;
    var build = function (tl, wrapper, at) {
      var img = wrapper.querySelector('[data-mask-image]');
      window.gsap.set(wrapper, { clipPath: 'inset(100% 0% 0% 0%)' });
      if (img) window.gsap.set(img, { scale: 1.15 });
      tl.to(wrapper, { clipPath: 'inset(0% 0% 0% 0%)', duration: 1.2 }, at);
      if (img) tl.to(img, { scale: 1, duration: 1.4 }, at);
    };
    if (opts.group) {
      var tl = window.gsap.timeline({ defaults: { ease: EASE }, scrollTrigger: st(opts.trigger || list[0], opts.start) });
      list.forEach(function (w, i) { build(tl, w, i * (opts.stagger || 0.1)); });
    } else {
      list.forEach(function (w) {
        var tl = window.gsap.timeline({ defaults: { ease: EASE }, scrollTrigger: st(w, opts.start) });
        build(tl, w, 0);
      });
    }
  };

  /* Scrub parallax on an over-sized image inside an overflow-hidden wrapper */
  api.parallax = function (img, wrapper, percent) {
    if (!ready || !hasST || !img) return;
    var p = percent || 7;
    window.gsap.fromTo(img, { yPercent: -p }, {
      yPercent: p, ease: 'none',
      scrollTrigger: { trigger: wrapper || img, start: 'top bottom', end: 'bottom top', scrub: true }
    });
  };

  /* Card hover: image zoom inside its mask + arrow nudge */
  api.hoverZoom = function (link) {
    if (!ready || !link) return;
    var img = link.querySelector('[data-hover-image]');
    var arrow = link.querySelector('[data-hover-arrow]');
    link.addEventListener('mouseenter', function () {
      if (img) window.gsap.to(img, { scale: 1.05, duration: 0.8, ease: EASE, overwrite: 'auto' });
      if (arrow) window.gsap.to(arrow, { x: 8, duration: 0.5, ease: EASE, overwrite: 'auto' });
    });
    link.addEventListener('mouseleave', function () {
      if (img) window.gsap.to(img, { scale: 1, duration: 0.8, ease: EASE, overwrite: 'auto' });
      if (arrow) window.gsap.to(arrow, { x: 0, duration: 0.5, ease: EASE, overwrite: 'auto' });
    });
  };

  /* Text roll: .roll-link with two [data-roll-text] children (second is the clone) */
  api.roll = function (link) {
    if (!ready || !link) return;
    var texts = link.querySelectorAll('[data-roll-text]');
    if (!texts.length) return;
    link.addEventListener('mouseenter', function () { window.gsap.to(texts, { yPercent: -100, duration: 0.5, ease: EASE, overwrite: 'auto' }); });
    link.addEventListener('mouseleave', function () { window.gsap.to(texts, { yPercent: 0,    duration: 0.5, ease: EASE, overwrite: 'auto' }); });
  };

  /* Button: arrow nudge (the fill/colour swap is CSS :hover) */
  api.buttonHover = function (btn) {
    if (!ready || !btn) return;
    var arrow = btn.querySelector('[data-button-arrow]');
    if (!arrow) return;
    btn.addEventListener('mouseenter', function () { window.gsap.to(arrow, { x: 6, duration: 0.5, ease: EASE, overwrite: 'auto' }); });
    btn.addEventListener('mouseleave', function () { window.gsap.to(arrow, { x: 0, duration: 0.5, ease: EASE, overwrite: 'auto' }); });
  };

  return api;
})();
</script>
